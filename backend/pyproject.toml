[project]
name = "flowgate-backend"
version = "0.1.0"
description = "FlowGate backend - free open-source web flow cytometry analysis (FastAPI + FlowKit)"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # FlowKit 1.x 系列（代码依赖其私有 API，2.x 可能 breaking）
    "flowkit>=1.3,<2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "pytest-cov>=7.1.0",
]

[tool.uv]
# 使用 uv 管理的 Python 3.12，避免系统 Python 3.14 与 FlowKit 依赖不兼容
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
