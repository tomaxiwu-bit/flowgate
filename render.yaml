# Render 蓝图：一个 Docker 服务，免费档即可跑起来。
# 用法：Render 控制台 New → Blueprint → 选本仓库 → Apply。
# 服务会监听 $PORT，/api 由 Next 转发到容器内的 FastAPI。

services:
  - type: web
    name: flowgate
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # 免费实例 512MB 内存：限制单文件大小与常驻 Sample 数量
      - key: FLOWGATE_MAX_UPLOAD_MB
        value: "100"
      - key: FLOWGATE_SAMPLE_CACHE_SIZE
        value: "2"
      - key: NODE_ENV
        value: production
